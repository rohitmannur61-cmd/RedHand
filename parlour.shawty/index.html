<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlour</title>
    <!-- SEO Best Practices -->
    <meta name="description" content="Parlour - Live stream featuring a relaxing atmosphere.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Vercel Analytics & Speed Insights -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>
    <div class="gradient-overlay"></div>
    <div class="content-wrapper">
        <header class="top-bar">
            <div class="top-left">
                <span id="local-time">--:-- --</span>
            </div>
            <div class="top-center">
                <span class="pulse-dot"></span>
                <span id="listener-count">-- online</span>
            </div>
            <div class="top-right">
                <a href="https://open.spotify.com/playlist/2ClYV7UUGVlrllvC3svF8a?si=XaAWz5F2RSKi2MWuv4tN1g"
                    class="pill-btn spotify" target="_blank" rel="noopener noreferrer">
                    <!-- Spotify Icon -->
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.659.301 1.02zM19.32 14.1c-.3.42-.84.54-1.26.24-3.36-2.04-8.52-2.64-12.54-1.44-.48.12-.96-.18-1.08-.66-.12-.48.18-.96.66-1.08 4.56-1.32 10.26-.66 14.04 1.62.42.3.54.84.18 1.32zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.2-1.26 11.28-1.02 15.721 1.62.539.3.72.96.42 1.5-.24.54-.84.72-1.32.42z" />
                    </svg>
                    Spotify <span class="arrow">↗</span>
                </a>
                <a href="https://music.youtube.com/playlist?list=PLCCTq6roR5bI&si=71kZ545FTGUMzb1z"
                    class="pill-btn yt-music" target="_blank" rel="noopener noreferrer">
                    <!-- YT Music Icon -->
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l8 4.5-8 4.5z" />
                    </svg>
                    YT Music <span class="arrow">↗</span>
                </a>
            </div>
        </header>

        <main class="main-content">
            <!-- Hidden YouTube Player -->
            <div id="yt-player" class="hidden-player"></div>
        </main>

        <footer class="bottom-bar">
            <div class="player-pill">
                <div class="thumbnail-wrapper">
                    <img id="thumbnail" class="thumbnail"
                        src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzMzMyIvPjwvc3ZnPg=="
                        alt="Album Art">
                    <div class="vinyl-hole"></div>
                </div>

                <div class="middle-section">
                    <div id="track-title" class="track-title">Loading...</div>
                    <div id="track-artist" class="track-artist">Please wait</div>

                    <div class="progress-bar-container" id="progress-bar-container">
                        <div class="progress-track"></div>
                        <div id="progress-fill" class="progress-fill"></div>
                        <div id="progress-scrubber" class="progress-scrubber"></div>
                    </div>

                    <div id="time-display" class="time-display">0:00 / 0:00</div>
                </div>

                <div class="controls">
                    <button id="prev-btn" class="control-btn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </button>

                    <button id="play-btn" class="play-btn" aria-label="Play/Pause">
                        <svg id="play-icon" viewBox="0 0 24 24" fill="black">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="pause-icon" viewBox="0 0 24 24" fill="black" style="display:none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>

                    <button id="next-btn" class="control-btn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
